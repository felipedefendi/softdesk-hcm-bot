<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Mesmo simbolo do Marca.tsx, mas com o verde cravado: o favicon nao
       enxerga o data-theme da pagina, entao usa o tom intermediario, que
       aparece bem tanto em aba clara quanto escura. Traco um pouco mais
       grosso que o do painel porque a 16px o original fecha demais. -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#00a06b" stroke-width="4.2"
          stroke-linecap="round" stroke-dasharray="16.7 6.33" transform="rotate(-90 16 16)"/>
  <circle cx="16" cy="16" r="3.6" fill="#00a06b"/>
</svg>
